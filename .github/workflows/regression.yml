name: Speed and Size Regression Reporter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**/*.ts"
      - "!src/**/*.test.ts"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base git ref to compare with (e.g. 0.12.0 or HEAD)"
        required: false
        type: string
        default: "HEAD"
      print_only:
        description: "Without comment on PR"
        required: false
        type: boolean
        default: false

jobs:
  regression:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Bun install
        run: bun install

      - name: Build current
        run: bun run prod

      - name: Setup environment and determine changes
        id: setup_env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "no_ts_changes=false" >> $GITHUB_OUTPUT
            BASE_REF="${{ inputs.base_ref }}"
            if [ -z "$BASE_REF" ]; then
              BASE_REF="HEAD"
            fi
            echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            TS_CHANGES=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep '^src/.*\.ts$' | grep -v '\.test\.ts$' || true)

            if [ -z "$TS_CHANGES" ]; then
              echo "no_ts_changes=true" >> $GITHUB_OUTPUT
            else
              echo "no_ts_changes=false" >> $GITHUB_OUTPUT
              git fetch origin ${{ github.event.pull_request.base.ref }} || exit 1
              echo "base_ref=origin/${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check if PR comment exists
        id: check_comment
        if: ${{ github.event_name == 'pull_request' && inputs.print_only != true && steps.setup_env.outputs.no_ts_changes != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/comment.js \
            --token $GITHUB_TOKEN \
            --owner ${{ github.repository_owner }} \
            --repo ${{ github.event.repository.name }} \
            --pr ${{ github.event.pull_request.number }} \
            --check

      - name: Run size comparison
        if: ${{ steps.setup_env.outputs.no_ts_changes != 'true' }}
        run: |
          bun scripts/size.js --diff "${{ steps.setup_env.outputs.base_ref }}" --out size_report.txt || exit 1

      - name: Post initial size report
        if: ${{ github.event_name == 'pull_request' && inputs.print_only != true && steps.setup_env.outputs.no_ts_changes != 'true' && steps.check_comment.outputs.exists != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Speed Regression Report" > size_only_output.txt
          echo "" >> size_only_output.txt
          echo "⏳ *Running speed benchmarks...*" >> size_only_output.txt
          echo "" >> size_only_output.txt
          echo "## Size Regression Report" >> size_only_output.txt
          echo "" >> size_only_output.txt
          echo '```txt' >> size_only_output.txt
          cat size_report.txt >> size_only_output.txt
          echo '```' >> size_only_output.txt

          bun scripts/comment.js \
            --token $GITHUB_TOKEN \
            --owner ${{ github.repository_owner }} \
            --repo ${{ github.event.repository.name }} \
            --pr ${{ github.event.pull_request.number }} \
            --body-file size_only_output.txt

      - name: Run benchmark comparison
        if: ${{ steps.setup_env.outputs.no_ts_changes != 'true' }}
        run: |
          bun scripts/bench.js --vign --diff "${{ steps.setup_env.outputs.base_ref }}" --out speed_report.txt || exit 1

      - name: Generate final report
        if: ${{ steps.setup_env.outputs.no_ts_changes != 'true' }}
        run: |
          echo "## Speed Regression Report" > final_regression_output.txt
          echo "" >> final_regression_output.txt
          echo '```txt' >> final_regression_output.txt
          cat speed_report.txt >> final_regression_output.txt
          echo '```' >> final_regression_output.txt
          echo "" >> final_regression_output.txt
          echo "## Size Regression Report" >> final_regression_output.txt
          echo "" >> final_regression_output.txt
          echo '```txt' >> final_regression_output.txt
          cat size_report.txt >> final_regression_output.txt
          echo '```' >> final_regression_output.txt

      - name: Print benchmark results to log
        if: ${{ (inputs.print_only == true || github.event_name == 'workflow_dispatch') && steps.setup_env.outputs.no_ts_changes != 'true' }}
        run: cat final_regression_output.txt

      - name: Comment PR (Final)
        if: ${{ github.event_name == 'pull_request' && inputs.print_only != true && steps.setup_env.outputs.no_ts_changes != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/comment.js \
            --token $GITHUB_TOKEN \
            --owner ${{ github.repository_owner }} \
            --repo ${{ github.event.repository.name }} \
            --pr ${{ github.event.pull_request.number }} \
            --body-file final_regression_output.txt
